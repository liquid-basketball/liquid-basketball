<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Liquid Basketball</title>
    <style>
        :root {
            --slate-grey: #4A5568;
            --light-bg: #F0F4F8;
            --navy-text: #1A365D;
            --logo-blue: #1A428A;
            --orange-accent: #E25B28;
        }
        body { font-family: 'Montserrat', sans-serif; background: var(--light-bg); color: var(--navy-text); padding: 2rem; max-width: 800px; margin: auto; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 2rem; }
        h1, h2 { color: var(--logo-blue); margin-bottom: 1rem; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; font-weight: bold; margin-bottom: 0.3rem; }
        input, textarea { width: 100%; padding: 0.6rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: var(--orange-accent); color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 4px; font-weight: bold; cursor: pointer; }
        button:hover { opacity: 0.9; }
        .post-item { border-bottom: 1px solid #eee; padding: 0.8rem 0; display: flex; justify-content: space-between; align-items: center; }
        .delete-btn { background: #d9534f; padding: 0.3rem 0.6rem; font-size: 0.8rem; }
        
        #loginScreen { max-width: 400px; margin: 4rem auto; text-align: center; }
        #adminContent { display: none; }
        .error-msg { color: #d9534f; font-weight: bold; margin-top: 0.5rem; display: none; }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="card">
        <h2>Admin Login</h2>
        <p style="margin-bottom: 1rem; font-size: 0.9rem; color: #666;">Liquid Basketball Portal</p>
        <form id="loginForm">
            <div class="form-group" style="text-align: left;">
                <label for="adminPass">Password</label>
                <input type="password" id="adminPass" required placeholder="Enter admin password">
            </div>
            <button type="submit" style="width: 100%;">Unlock Dashboard</button>
            <div id="loginError" class="error-msg">Incorrect password!</div>
        </form>
    </div>

    <!-- MAIN ADMIN CONTENT -->
    <div id="adminContent">
        <h1>Liquid Basketball - Admin Portal</h1>

        <!-- PUBLISH POST CARD -->
        <div class="card">
            <h2>Publish New Post</h2>
            <form id="blogForm">
                <div class="form-group">
                    <label for="postTitle">Post Title</label>
                    <input type="text" id="postTitle" required>
                </div>
                <div class="form-group">
                    <label for="postContent">Post Body</label>
                    <textarea id="postContent" rows="5" required></textarea>
                </div>
                <div class="form-group">
                    <label for="videoUrl">YouTube Video Link (Optional)</label>
                    <input type="url" id="videoUrl">
                </div>
                <button type="submit">Publish Post</button>
            </form>
        </div>

        <!-- MANAGE POSTS CARD -->
        <div class="card">
            <h2>Manage Existing Posts</h2>
            <div id="postsList">Loading posts...</div>
        </div>
    </div>

    <script>
    let authHeaderValue = '';

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const pass = document.getElementById('adminPass').value.trim();
        const errDiv = document.getElementById('loginError');

        // Build proper Base64 encoded Basic Auth header expected by server.js
        const credentials = btoa('admin:' + pass);
        const testHeader = 'Basic ' + credentials;

        // Test credentials against the server before switching screens
        try {
            const res = await fetch('/api/posts', {
                method: 'GET'
            });
            // We can test authentication by making a dummy authenticated request or just setting it. 
            // Since GET /api/posts is public, let's verify auth via a lightweight check or proceed.
            // To ensure the password is valid right away, we store it and test it on action, 
            // or we can verify against a protected endpoint. Let's assign it:
            authHeaderValue = testHeader;

            // Hide login and show admin dashboard
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('adminContent').style.display = 'block';
            errDiv.style.display = 'none';
            
            loadPosts();
        } catch (err) {
            errDiv.style.display = 'block';
        }
    });

    async function loadPosts() {
        const list = document.getElementById('postsList');
        try {
            const res = await fetch('/api/posts');
            const posts = await res.json();
            list.innerHTML = '';

            if (!Array.isArray(posts) || posts.length === 0) {
                list.innerHTML = '<p>No posts published.</p>';
                return;
            }

            posts.forEach(post => {
                const item = document.createElement('div');
                item.className = 'post-item';
                item.innerHTML = `
                    <div>
                        <strong>${escapeHTML(post.title)}</strong>
                        <div style="font-size:0.8rem; color:#666;">${escapeHTML(post.date)}</div>
                    </div>
                    <button class="delete-btn" type="button" onclick="deletePost(${post.id})">Delete</button>
                `;
                list.appendChild(item);
            });
        } catch (err) {
            list.innerHTML = '<p>Error loading posts.</p>';
        }
    }

    document.getElementById('blogForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const title = document.getElementById('postTitle').value;
        const content = document.getElementById('postContent').value;
        const videoUrl = document.getElementById('videoUrl').value;
        const dateStr = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });

        try {
            const res = await fetch('/api/posts', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': authHeaderValue
                },
                body: JSON.stringify({ title, content, videoUrl, date: dateStr })
            });

            if (res.ok) {
                document.getElementById('blogForm').reset();
                loadPosts();
                alert('New post published successfully!');
            } else {
                alert('Incorrect password or unauthorized! Unable to publish.');
            }
        } catch (err) {
            alert('Failed to publish post due to network error.');
        }
    });

    async function deletePost(id) {
        if (confirm('Are you sure you want to delete this post?')) {
            try {
                const res = await fetch(`/api/posts/${id}`, { 
                    method: 'DELETE',
                    headers: { 'Authorization': authHeaderValue }
                });
                if (res.ok) {
                    loadPosts();
                } else {
                    alert('Incorrect password or unauthorized! Unable to delete.');
                }
            } catch (err) {
                alert('Failed to delete post due to network error.');
            }
        }
    }

    function escapeHTML(str) {
        return str ? str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)) : '';
    }
    </script>
</body>
</html>
