<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - Liquid Basketball</title>
    <style>
        :root { --navy: #1A365D; --orange: #E25B28; --bg: #F0F4F8; }
        body { font-family: sans-serif; background: var(--bg); color: #2D3748; padding: 2rem; max-width: 900px; margin: auto; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 2rem; }
        h1, h2 { color: var(--navy); }
        .form-group { margin-bottom: 1rem; }
        label { display: block; font-weight: bold; margin-bottom: 0.3rem; }
        input, textarea, select { width: 100%; padding: 0.6rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: var(--orange); color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 4px; font-weight: bold; cursor: pointer; }
        button:hover { opacity: 0.9; }
        .hidden { display: none; }
        .post-item { border-bottom: 1px solid #eee; padding: 0.8rem 0; display: flex; justify-content: space-between; align-items: center; }
        .delete-btn { background: #d9534f; font-size: 0.8rem; }
    </style>
</head>
<body>

    <!-- AUTH SECTION -->
    <div id="authSection" class="card">
        <h2>🔒 Admin Verification</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="adminPass">Enter Secret Password</label>
                <input type="password" id="adminPass" required>
            </div>
            <button type="submit">Unlock Portal</button>
        </form>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="dashboardSection" class="hidden">
        <h1>Liquid Basketball — Secret Admin Portal</h1>

        <!-- CHANGE PASSWORD -->
        <div class="card">
            <h2>🔑 Password Settings</h2>
            <form id="passwordForm">
                <div class="form-group">
                    <label for="newPass">New Password</label>
                    <input type="password" id="newPass" required>
                </div>
                <button type="submit">Update Password</button>
            </form>
        </div>

        <!-- PUBLISH POST -->
        <div class="card">
            <h2>📝 Create Post</h2>
            <form id="postForm">
                <div class="form-group">
                    <label>Post Title</label>
                    <input type="text" id="postTitle" required>
                </div>
                <div class="form-group">
                    <label>Where should this post appear?</label>
                    <select id="targetPage">
                        <option value="news">News & Media Page Only</option>
                        <option value="home">Front Page Only</option>
                        <option value="both">Both Front Page & News Page</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Post Body (Supports standard text or HTML links like: <code>&lt;a href="https://example.com"&gt;Link&lt;/a&gt;</code>)</label>
                    <textarea id="postContent" rows="5" required></textarea>
                </div>
                <div class="form-group">
                    <label>Attach Photo (Upload File or paste Image URL)</label>
                    <input type="file" id="imageFileInput" accept="image/*" style="margin-bottom: 0.5rem;">
                    <input type="url" id="imageUrlInput" placeholder="https://example.com/image.jpg">
                </div>
                <div class="form-group">
                    <label>YouTube Video Link (Optional Embed)</label>
                    <input type="url" id="videoUrl" placeholder="https://www.youtube.com/watch?v=...">
                </div>
                <button type="submit">Publish Post</button>
            </form>
        </div>

        <!-- EDIT FRONT PAGE CONTENT -->
        <div class="card">
            <h2>🎨 Edit Front Page Dynamic Headers</h2>
            <form id="frontPageForm">
                <div class="form-group">
                    <label>Hero Subtitle</label>
                    <input type="text" id="cms-hero-sub">
                </div>
                <div class="form-group">
                    <label>Main Headline Title</label>
                    <input type="text" id="cms-headline-title">
                </div>
                <div class="form-group">
                    <label>Main Headline Body</label>
                    <textarea id="cms-headline-body" rows="3"></textarea>
                </div>
                <button type="submit">Save Front Page Texts</button>
            </form>
        </div>

        <!-- MANAGE POSTS -->
        <div class="card">
            <h2>⚙️ Manage Posts</h2>
            <div id="postsList">Loading...</div>
        </div>
    </div>

    <script>
    let activePassword = '';

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const pass = document.getElementById('adminPass').value.trim();
        
        try {
            const res = await fetch('/api/admin/verify', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'x-admin-password': pass 
                }
            });

            if (res.ok) {
                activePassword = pass;
                document.getElementById('authSection').classList.add('hidden');
                document.getElementById('dashboardSection').classList.remove('hidden');
                loadPosts();
                loadCMS();
            } else if (res.status === 401) {
                alert('Incorrect password! Please check uppercase/lowercase characters.');
            } else {
                alert(`Server error (${res.status}). Check backend logs or Supabase database table status.`);
            }
        } catch (err) {
            alert('Network failure connecting to backend API.');
            console.error(err);
        }
    });

    document.getElementById('passwordForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const newPassword = document.getElementById('newPass').value.trim();
        const res = await fetch('/api/admin/change-password', {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json', 
                'x-admin-password': activePassword 
            },
            body: JSON.stringify({ newPassword })
        });
        if (res.ok) {
            activePassword = newPassword;
            alert('Password successfully changed!');
            document.getElementById('passwordForm').reset();
        } else {
            alert('Failed to update password.');
        }
    });

    document.getElementById('postForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const title = document.getElementById('postTitle').value;
        const targetPage = document.getElementById('targetPage').value;
        const content = document.getElementById('postContent').value;
        const videoUrl = document.getElementById('videoUrl').value;
        let imageUrl = document.getElementById('imageUrlInput').value;

        const fileInput = document.getElementById('imageFileInput');
        if (fileInput.files.length > 0) {
            imageUrl = await convertBase64(fileInput.files[0]);
        }

        const date = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });

        const res = await fetch('/api/posts', {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json', 
                'x-admin-password': activePassword 
            },
            body: JSON.stringify({ title, targetPage, content, videoUrl, imageUrl, date })
        });

        if (res.ok) {
            document.getElementById('postForm').reset();
            loadPosts();
            alert('Published!');
        } else {
            alert('Failed to publish post.');
        }
    });

    document.getElementById('frontPageForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = {
            'cms-hero-sub': document.getElementById('cms-hero-sub').value,
            'cms-headline-title': document.getElementById('cms-headline-title').value,
            'cms-headline-body': document.getElementById('cms-headline-body').value
        };
        const res = await fetch('/api/cms', {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json', 
                'x-admin-password': activePassword 
            },
            body: JSON.stringify(payload)
        });
        if (res.ok) alert('Front page updated!');
    });

    async function loadCMS() {
        try {
            const res = await fetch('/api/cms');
            const data = await res.json();
            for (let key in data) {
                if (document.getElementById(key)) document.getElementById(key).value = data[key];
            }
        } catch (e) {
            console.error('Failed to load CMS content:', e);
        }
    }

    async function loadPosts() {
        const list = document.getElementById('postsList');
        try {
            const res = await fetch('/api/posts');
            const posts = await res.json();
            list.innerHTML = posts.length ? '' : '<p>No posts found.</p>';
            posts.forEach(post => {
                const item = document.createElement('div');
                item.className = 'post-item';
                item.innerHTML = `
                    <div>
                        <strong>${post.title}</strong> <small>(${post.target_page})</small>
                        <div style="font-size:0.8rem; color:#666;">${post.date}</div>
                    </div>
                    <button class="delete-btn" onclick="deletePost(${post.id})">Delete</button>
                `;
                list.appendChild(item);
            });
        } catch (e) {
            list.innerHTML = '<p>Error loading posts.</p>';
        }
    }

    async function deletePost(id) {
        if (confirm('Delete post?')) {
            await fetch(`/api/posts/${id}`, {
                method: 'DELETE',
                headers: { 'x-admin-password': activePassword }
            });
            loadPosts();
        }
    }

    function convertBase64(file) {
        return new Promise((resolve, reject) => {
            const fileReader = new FileReader();
            fileReader.readAsDataURL(file);
            fileReader.onload = () => resolve(fileReader.result);
            fileReader.onerror = (error) => reject(error);
        });
    }
    </script>
</body>
</html>
